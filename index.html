<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0e1116">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Бюджет">
  <title>Бюджет</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1 id="screen-title">Доходы</h1>
    <button id="backup-btn" class="icon-btn" aria-label="Резервная копия">⇅</button>
  </header>

  <main id="main">
    <!-- Доходы -->
    <section id="screen-incomes" class="screen active">
      <form id="income-form" class="form">
        <label><span>Сумма</span>
          <input type="number" id="income-amount" inputmode="decimal" step="0.01" min="0" placeholder="0" required>
        </label>
        <label><span>Категория</span>
          <select id="income-category"></select>
        </label>
        <label><span>Дата</span>
          <input type="date" id="income-date" required>
        </label>
        <label><span>Примечание (необязательно)</span>
          <input type="text" id="income-note" placeholder="">
        </label>
        <button type="submit" class="primary">Сохранить доход</button>
      </form>
      <h2 class="section-title">Список доходов</h2>
      <div id="income-list" class="list"></div>
    </section>

    <!-- Расходы -->
    <section id="screen-expenses" class="screen">
      <form id="expense-form" class="form">
        <label><span>Сумма</span>
          <input type="number" id="expense-amount" inputmode="decimal" step="0.01" min="0" placeholder="0" required>
        </label>
        <label><span>Категория</span>
          <select id="expense-category"></select>
        </label>
        <label><span>Дата</span>
          <input type="date" id="expense-date" required>
        </label>
        <label><span>Примечание (необязательно)</span>
          <input type="text" id="expense-note" placeholder="">
        </label>
        <button type="submit" class="primary">Сохранить расход</button>
      </form>
      <h2 class="section-title">Список расходов</h2>
      <div id="expense-list" class="list"></div>
    </section>

    <!-- Категории -->
    <section id="screen-categories" class="screen">
      <div class="cat-tabs">
        <button class="cat-tab active" data-cat="income">Доходы</button>
        <button class="cat-tab" data-cat="expense">Расходы</button>
      </div>
      <div class="form">
        <label><span id="cat-input-label">Название категории дохода</span>
          <input type="text" id="cat-input" placeholder="Например, Зарплата">
        </label>
        <button id="cat-add-btn" class="primary" type="button">Добавить категорию дохода</button>
      </div>
      <h2 class="section-title">Список категорий</h2>
      <div id="cat-list" class="list"></div>
    </section>

    <!-- Статистика -->
    <section id="screen-stats" class="screen">
      <div class="period">
        <button class="period-btn" data-period="month">Месяц</button>
        <button class="period-btn" data-period="year">Год</button>
        <button class="period-btn" data-period="all">Весь</button>
      </div>
      <div id="stats-summary" class="summary card"></div>
      <h2 class="section-title">По дням</h2>
      <div id="stats-days"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-screen="incomes" class="active">Доходы</button>
    <button data-screen="expenses">Расходы</button>
    <button data-screen="categories">Категории</button>
    <button data-screen="stats">Статистика</button>
  </nav>

  <!-- Оверлей резервной копии -->
  <div class="overlay" id="backup-overlay">
    <div class="ov-header">
      <button class="icon-btn" id="backup-close" aria-label="Закрыть">✕</button>
      <div class="ov-title">Резервная копия</div>
      <div class="ov-spacer"></div>
    </div>
    <div class="ov-body">
      <div class="hint">
        Данные хранятся только в этом браузере. Если очистить Safari — всё пропадёт.
        Скопируйте текст и сохраните в «Заметках» или скачайте файлом.
      </div>
      <textarea class="ov-textarea" id="backup-text" spellcheck="false"
                autocapitalize="off" autocorrect="off"></textarea>
      <div class="btn-row">
        <button class="btn" id="copy-backup">Скопировать</button>
        <button class="btn" id="download-backup">Скачать файл</button>
      </div>
      <div class="btn-row">
        <button class="btn" id="load-file-btn">Загрузить файл</button>
        <button class="btn primary" id="restore-backup">Восстановить</button>
      </div>
      <div class="hint">«Восстановить» применит JSON из поля выше — можно просто вставить текст.</div>
      <input type="file" id="file-input" accept=".json,application/json" hidden>
    </div>
  </div>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
